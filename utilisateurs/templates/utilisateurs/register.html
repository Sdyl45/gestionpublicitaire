<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <style>
        body {
            background-image: url('static/images/OIP.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: blue;
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
        }

        .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        button[type="submit"],
        button[type="reset"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            flex-grow: 1;
            margin: 0 5px;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        button[type="reset"] {
            background-color: red;
        }

        button[type="reset"]:hover {
            background-color: #c00000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form">
            <form method="post" action="">

                {% csrf_token %}
                <h1>Inscription</h1>
                {{ form.as_p }}
                <div class="buttons">
                    <button type="submit">S'inscrire</button> <br>

                    <button style="background:red;" type="reset">Réinitialiser</button>
                </div>

            <p class="link">Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
                </form>
        </div>
    </div>
</body>
</html>
