{% load static%}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <style>
        body {
            background-image: url('static/images/OIP.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #4CAF50;
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        h2 {
            color: blue;
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #4CAF50; /* Couleur pour le focus */
            outline: none;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex-grow: 1;
            margin: 0 5px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        button[type="reset"] {
            background-color: red;
            color: white;
        }

        button[type="reset"]:hover {
            background-color: #c00000;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #4CAF50;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
<a class="sidebar-brand d-flex align-items-center justify-content-center" href="{%  url 'index'%}">
                <div class="sidebar-brand-icon rotate-n-10">

                    <img class=""  src="{% static 'images/logo1.png' %}" alt="alt" style="height: 250px; margin-left:150px;">
                </div>
            </a>        <h1>Register</h1>
        <form method="post" action="">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="buttons">
                <button type="submit">S'inscrire</button>
                <button type="reset">Réinitialiser</button>
            </div>
        </form>
        <p class="link">Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
    </div>
</body>
</html>
