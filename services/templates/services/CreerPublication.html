{% extends 'base.html' %}
{% load static %}

{% block slider %}

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publication</title>

  <style>
    /* Style global du conteneur */
    .container {
        padding: 40px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f4f4f4;
        max-width: 600px;
        margin: 50px auto;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* Style des titres */
    h2 {
        text-align: center;
        color: #333;
        font-family: 'Arial', sans-serif;
        margin-bottom: 20px;
    }

    /* Style des champs de formulaire */
    form input, form select, form textarea {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
        transition: border-color 0.3s ease-in-out;
    }

    /* Réduire la hauteur du textarea */
    form textarea {
        height: 100px; /* Ajustez la hauteur selon vos besoins */
    }

    /* Style pour focus des champs */
    form input:focus, form select:focus, form textarea:focus {
        border-color: #007BFF;
        outline: none;
    }

    /* Style du bouton principal */
    button {
        width: 100%;
        padding: 12px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s;
        margin-top: 10px;
    }

    /* Effet au survol du bouton */
    button:hover {
        background-color: #45a049;
    }

    /* Bouton de reset */
    .btn-reset {
        background-color: red;
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s;
    }

    .btn-reset:hover {
        background-color: darkred;
    }

    /* Style pour un bouton secondaire (si vous en avez besoin) */
    .btn-secondary {
        display: block;
        margin-top: 20px;
        padding: 12px;
        background-color: #007BFF;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s;
    }

    .btn-secondary:hover {
        background-color: #0056b3;
    }

    /* Style des messages d'erreur (optionnel) */
    .text-danger {
        color: red;
        font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Publier sur Facebook</h2>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Publier</button>
        <button type="reset" class="btn-reset">Annuler</button>
    </form>

    <!-- Optionnel : un lien vers une autre page -->
    <!-- <a href="{% url 'listPubs' %}" class="btn-secondary">Retour à la liste des publications</a> -->
  </div>

</body>
</html>
{% endblock %}
