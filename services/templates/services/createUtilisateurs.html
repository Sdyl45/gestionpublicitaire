{% extends 'base.html' %}
{% load static %}



{% block body %}


<h1>
    Ajouter un utilisateurs
</h1>

<style>
    /* Styles généraux */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Styles du formulaire */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccd0d5;
      border-radius: 3px;
      font-size: 16px;
    }

    button {
      background-color: #1877f2;
      color: #ffffff;
      border: none;
      border-radius: 3px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1366d6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create User</h1>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password"> confirmation Password</label>
        <input type="password" id="confirm_password" name="password" required>
      </div>
      <button class="btn btn-danger" type="submit">Create User</button>
    </form>
  </div>




{% endblock %}










</body>

</html>
