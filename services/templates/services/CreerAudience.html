{% extends 'base.html' %}
{% load static %}



{% block body %}


<style>
    /* Styles généraux */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Styles du formulaire */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccd0d5;
      border-radius: 3px;
      font-size: 16px;
    }

    button {

      color: #ffffff;
      border: none;
      border-radius: 3px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1366d6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Audience</h1>
    <form>
      <div class="form-group">
        <label for="audience-name">Audience Name</label>
        <input type="text" id="audience-name" name="audience-name" required>
      </div>
      <div class="form-group">
        <label for="location">Location</label>
        <select id="location" name="location" required>
          <option value="">Selection localisation</option>
          <option value="usa">Yaounde</option>
          <option value="canada">Douala</option>
          <option value="uk">Bafoussam</option>
          <option value="france">Ebolowa</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age-range">Age Range</label>
        <select id="age-range" name="age-range" required>
          <option value="">Select an age range</option>
          <option value="18-24">18-24 years old</option>
          <option value="25-34">25-34 years old</option>
          <option value="35-44">35-44 years old</option>
          <option value="45-54">45-54 years old</option>
          <option value="55+">55+ years old</option>
        </select>
      </div>
      <div class="form-group">
        <label for="interests">Interests</label>
        <textarea id="interests" name="interests" rows="3" required></textarea>
      </div>
      <button class="btn btn-danger" type="submit">Create Audience</button>
    </form>
  </div>


{% endblock %}



</body>

</html>
