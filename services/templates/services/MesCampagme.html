{% extends 'base.html' %}
{% load static %}

{% block slider %}


<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une Campagne</title>
  <style>
        body {
            background-image: url('{% static "images/OIP.jpg" %}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h2 {
            color: #FF5733; /* Couleur rouge-orangé */
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
        }

        .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #4CAF50; /* Couleur pour le focus */
            outline: none;
        }

        button {
            grid-column: 1 / -1;
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .btn-reset {
            background-color: red;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background-color: darkred;
        }

        .btn-secondary {
            display: inline-block;
            margin-top: 10px;
            text-align: center;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-secondary:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

  <div class="container">
    <h2>CRÉER UNE CAMPAGNE</h2>

    <form method="POST" action="{% url 'creer_campagne' %}">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Affiche le formulaire automatiquement -->
        <button type="submit">CRÉER</button>
        <button type="reset" class="btn-reset">Annuler</button>
        <a href="{% url 'CampagneList' %}" class="btn btn-secondary">Retour</a>
    </form>
  </div>
</body>
</html>

{% endblock %}
