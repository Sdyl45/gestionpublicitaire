{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Répondre au commentaire</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.reply_message.label_tag }}
            {{ form.reply_message }}
        </div>
        <input type="submit" class="btn btn-primary" value="Envoyer la réponse">
    </form>
</div>
{% endblock %}
