
{% extends 'base.html' %}
{% load static %}

{% block slider %}

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>location</title>
  <style>
        body {
            background-image: url('static/images/OIP.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: blue;
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
        }

        .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            grid-column: 1 / -1;
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .btn-reset {
            background-color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

  <div class="container">
  <h2 STYLE="color: red; text-align:center; font-size:24px">CREER UNE LOCALISATION</h2>
  <form method="POST" action="">
   {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">CREER</button>
    <button class="btn-reset" style="background-color: red; margin-top:10px;" type="reset">Annuler</button>
      <a style="padding: 5px 10px; background-color: blue; margin-bottom:20px;" href="{% url 'CampagneList' %}" type="button" class="btn btn-secondary btn-sm"> Retour</a>

  </form>
  </div>
</body>
</html>
{% endblock %}
